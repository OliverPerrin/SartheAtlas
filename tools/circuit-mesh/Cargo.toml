[package]
name = "sarthe-circuit-mesh"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
earcutr = "=0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
